services:
  db:
    image: mysql:8
    restart: unless-stopped
    # log_bin_trust_function_creators: por defecto MySQL 8 exige el
    # privilegio SUPER para crear triggers/funciones cuando el binary
    # log esta activo (ver tests/run-tests.ps1, carga del esquema con
    # el usuario sigeru_app). Con esta opcion no hace falta darle SUPER
    # a un usuario de aplicacion solo para poder crear los triggers de
    # sql/sigeru_schema.sql (RN01, generalizacion disjunta de USUARIO).
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: rootpass_dev
      MYSQL_DATABASE: sigeru
      MYSQL_USER: sigeru_app
      MYSQL_PASSWORD: sigeru_pass_dev
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecutan una sola vez, en orden alfabético del nombre DESTINO,
      # la primera vez que se crea el volumen db_data (comportamiento
      # estándar de la imagen oficial de MySQL): primero el esquema,
      # después los datos de prueba.
      - ./sql/sigeru_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/datos_prueba.sql:/docker-entrypoint-initdb.d/02-datos-prueba.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "3306:3306"   # permite correr tests/run-tests.sh desde la PC
                       # (fuera de Docker) contra esta base

  backend:
    build: ./Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SIGERU_DB_HOST: db
      SIGERU_DB_PORT: "3306"
      SIGERU_DB_NAME: sigeru
      SIGERU_DB_USER: sigeru_app
      SIGERU_DB_PASS: sigeru_pass_dev
      # Envío real de emails (responder a vecinos desde el panel — ver
      # "Envío de emails" en el README). Se toman del entorno donde se
      # corre `docker compose up` (ej. exportadas antes, o en un .env);
      # si no están seteadas quedan vacías y el envío avisa que falta
      # configurarlo, en vez de fallar sin explicación.
      SIGERU_SMTP_HOST: ${SIGERU_SMTP_HOST:-}
      SIGERU_SMTP_PORT: ${SIGERU_SMTP_PORT:-587}
      SIGERU_SMTP_USER: ${SIGERU_SMTP_USER:-}
      SIGERU_SMTP_PASS: ${SIGERU_SMTP_PASS:-}
      SIGERU_SMTP_FROM: ${SIGERU_SMTP_FROM:-}
    ports:
      - "8081:80"   # opcional, solo para pegarle directo a la API al debuggear

  frontend:
    build: ./Frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "8082:80"   # phpMyAdmin para la base de Docker (no confundir con la de XAMPP)

volumes:
  db_data:
