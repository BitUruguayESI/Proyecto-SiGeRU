<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - BITURUGUAY</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <!-- Navbar Simple -->
    <nav class="navbar">
        <div class="container navbar-container">
            <div class="logo">
                <h1>BITURUGUAY</h1>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Volver al Inicio</a></li>
            </ul>
        </div>
    </nav>

    <!-- Formulario de Registro -->
    <div class="form-container">
        <h2>Crear Cuenta en BITURUGUAY</h2>
        
        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="password-confirm">Confirmar Contraseña:</label>
                <input type="password" id="password-confirm" name="password-confirm" required>
            </div>

            <div class="form-group">
                <label for="empresa">Empresa/Organización:</label>
                <input type="text" id="empresa" name="empresa">
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn btn-primary">Registrarse</button>
                <a href="login.html" class="btn btn-secondary">Ir a Iniciar Sesión</a>
            </div>
        </form>

        <p class="text-center text-muted mt-2">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </p>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 BITURUGUAY - Sistema de Gestión de Rutas</p>
        </div>
    </footer>

    <script src="../js/registro.js"></script>
</body>
</html>
