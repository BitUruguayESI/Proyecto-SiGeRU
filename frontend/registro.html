<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGERU - Registro</title>
    
    <!-- Tipografía Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Enlace al CSS unificado -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="centered-body"> <!-- Añadimos centered-body para centrar el formulario -->

    <main class="form-container">
        <!-- Encabezado del Formulario -->
        <h1 class="brand-title">SiGeRU</h1>
        <p class="form-subtitle">Solicitar registro de usuario</p>

        <!-- Formulario (Se agregó el id="formRegistro") -->
        <form id="formRegistro" action="#">
            <div class="input-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="input-group">
                <label for="CI">C.I.</label>
                <!-- Se cambió el id a "CI" para que coincida con el JS -->
                <input type="text" id="CI" placeholder="Ej: 12345678" required>
            </div>

            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="Ej: juan.perez@correo.com" required>
            </div>

            <div class="input-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" placeholder="Ej: 099123456" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese contraseña" required>
            </div>

            <button type="submit" class="btn-submit">Registrarme</button>
        </form>

       <!-- Footer del Formulario -->
        <p class="form-footer">¿Ya tenés una cuenta? <a href="login.html">Iniciar sesión</a></p>
    </main>

    <!-- VÍNCULO CON TU ARCHIVO JAVASCRIPT DE REGISTRO -->
    <script src="js/registro.js?v=2"></script>
</body>
</html>
