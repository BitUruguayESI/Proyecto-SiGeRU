<!DOCTYPE html>
<html lang="es">
<head>

    <title>SIGERU - Gestión de Residuos Urbanos</title>
    
    <!-- Tipografía Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<body>

    <header class="navbar">

        <section class="col-left">

            <div class="logo-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="svg-logo" width="180" height="180">
                    <defs>
                        <linearGradient id="gradShield" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#63b3ed;" />
                            <stop offset="100%" style="stop-color:#7c3aed;" />

                        <linearGradient id="gradLines" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#4facfe;" />

                    <path d="M50,12 L82,23 L82,55 C82,73 68,85 50,90 C32,85 18,73 18,55 L18,23 Z" fill="none" stroke="url(#gradShield)" stroke-width="4.5" stroke-linejoin="round"/>

                    <path d="M32,52 L48,52 L52,62 L68,62" fill="none" stroke="url(#gradLines)" stroke-width="3.5" stroke-linecap="round"/>
                    <circle cx="48" cy="52" r="3" fill="#4facfe"/>
                    <circle cx="52" cy="62" r="3" fill="#00f2fe"/>

                <h2 class="logo-text">SIGERU</h2>

            <a href="registro.html" class="btn btn-secondary">Registrarse</a>
