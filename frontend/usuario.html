<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - SiGeRU</title>

    <link rel="stylesheet" href="css/estilos.css">

    <style>
        /* Estilos rapidos para el formulario, mientras se agregan al estilos.css */
        #formUsuario label{
            display:block;
            margin-top:15px;
            margin-bottom:8px;
            font-weight:bold;
        }
        #formUsuario input, #formUsuario select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
        }
        #formUsuario button{
            padding:12px 25px;
            background:#2e7d32;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }
        #formUsuario button:hover{
            background:#1b5e20;
        }
        #formUsuario button[type="button"]{
            background:#999;
        }
        #formUsuario button[type="button"]:hover{
            background:#777;
        }
    </style>
</head>

<body>

<div class="dashboard">

    <!-- Menú lateral -->
    <aside class="sidebar">

        <h2>SiGeRU</h2>

        <ul>
            <li><a href="dashboard.html">🏠 Dashboard</a></li>
            <li><a href="usuario.html">👥 Usuarios</a></li>
            <li><a href="contenedores.html">🗑 Contenedores</a></li>
            <li><a href="camiones.html">🚛 Camiones</a></li>
            <li><a href="#">⚠ Incidencias</a></li>
            <li><a href="#">📊 Reportes</a></li>
            <li><a href="login.html">🚪 Cerrar sesión</a></li>
        </ul>

    </aside>

    <!-- Contenido principal -->
    <main class="contenido">

        <header class="topbar">
            <h1>Gestión de Usuarios</h1>
            <span>👤 Administrador Municipal</span>
        </header>

        <section class="principal">

            <!-- Formulario de alta / edición -->
            <div class="card-dashboard" style="margin-bottom:30px;">

                <h3 id="tituloFormulario">Nuevo Usuario</h3>

                <form id="formUsuario">

                    <input type="hidden" id="usuarioId">

                    <label>Nombre completo</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>

                    <label>Usuario</label>
                    <input type="text" id="usuarioLogin" placeholder="Ej: jperez" required>

                    <label>Contraseña</label>
                    <input type="password" id="passwordUsuario" placeholder="Ingrese contraseña">

                    <label>Rol</label>
                    <select id="rol" required>
                        <option value="">Seleccione un rol</option>
                        <option value="Administrador">Administrador Municipal</option>
                        <option value="Cuadrilla">Cuadrilla de Recolección</option>
                        <option value="Operario">Operario</option>
                        <option value="Vecino">Vecino</option>
                    </select>

                    <div style="display:flex; gap:15px; margin-top:20px;">
                        <button type="submit">Guardar</button>
                        <button type="button" onclick="cancelarEdicion()">Cancelar</button>
                    </div>

                </form>

            </div>

            <!-- Listado de usuarios -->
            <div class="card-dashboard">

                <h3>Usuarios Registrados</h3>

                <table style="width:100%; border-collapse:collapse; margin-top:15px;">
                    <thead>
                        <tr style="text-align:left; border-bottom:2px solid #eee;">
                            <th style="padding:10px;">ID</th>
                            <th style="padding:10px;">Nombre</th>
                            <th style="padding:10px;">Usuario</th>
                            <th style="padding:10px;">Rol</th>
                            <th style="padding:10px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                        <!-- Las filas se cargan dinámicamente con usuarios.js -->
                    </tbody>
                </table>

            </div>

        </section>

    </main>

</div>

<script src="js/usuarios.js"></script>

</body>

</html>
