<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - SiGeRU</title>

    <link rel="stylesheet" href="css/estilos.css">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-box">

        <h1>SiGeRU</h1>

        <h2>Sistema de Gestión de Residuos Urbanos</h2>

        <form id="formLogin">

            <label>Usuario</label>

            <input
                type="text"
                id="usuario"
                placeholder="Ingrese su usuario"
                required
            >

            <label>Contraseña</label>

            <input
                type="password"
                id="password"
                placeholder="Ingrese su contraseña"
                required
            >

            <button type="submit">

                Iniciar sesión

            </button>

        </form>

        <p>

            ¿No posee una cuenta?

            <a href="registro.html">Solicitar registro</a>

        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>

</html>
