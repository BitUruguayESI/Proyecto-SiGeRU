<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGERU - Iniciar Sesión</title>
    
    <!-- Tipografía Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- Enlace al CSS unificado -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="centered-body"> <!-- AHORA EL FORMULARIO QUEDARÁ TOTALMENTE CENTRADO -->

    <main class="form-container">
        <!-- Encabezado del Login -->
        <h1 class="brand-title">SiGeRU</h1>
        <p class="form-subtitle">Sistema de Gestión de Residuos Urbanos</p>

        <!-- Formulario ordenado en bloques verticales -->
        <form id="formLogin">
            <div class="input-group">
                <label for="CI">C.I.</label>
                <!-- ID corregido a "CI" en mayúsculas para coincidir con login.js -->
                <input type="text" id="CI" placeholder="Ingrese su C.I. sin puntos ni guiones" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingrese su contraseña" required>
            </div>

            <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>

        <!-- Footer del Login (dentro del contenedor principal para que no flote) -->
        <p class="form-footer">¿No posee una cuenta? <a href="registro.html">Solicitar registro</a></p>
    </main>

    <!-- VÍNCULO CON TU ARCHIVO JAVASCRIPT DE LOGIN (antes de cerrar el body) -->
    <script src="js/login.js?v=2"></script>
</body>
</html>
