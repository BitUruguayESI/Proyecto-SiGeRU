<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiGeRU — Restablecer contraseña</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body class="centered-body">
  <div class="form-container">
    <img src="img/logo.jpg" alt="SiGeRU" class="login-logo-top">
    <h1 class="brand-title">SiGeRU</h1>
    <p class="form-subtitle">Elegir contraseña nueva</p>

    <p style="font-size:13px; color:#a0aec0; margin-bottom:16px;">
      Ingresá el código de 6 dígitos que te mandamos por email junto con tu contraseña nueva.
    </p>

    <form id="formRestablecer" novalidate>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="input-group">
        <label for="codigo">Código</label>
        <input type="text" id="codigo" name="codigo" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
      </div>

      <div class="input-group">
        <label for="contrasena">Contraseña nueva</label>
        <input type="password" id="contrasena" name="contrasena" minlength="8" required>
      </div>

      <div class="input-group">
        <label for="confirmar_contrasena">Confirmar contraseña</label>
        <input type="password" id="confirmar_contrasena" required>
      </div>

      <button type="submit" class="btn-submit">Guardar contraseña</button>
      <div id="mensaje" class="mensaje"></div>
      <div class="form-footer">
        <a href="login.html">Volver a iniciar sesión</a>
      </div>
    </form>
  </div>

  <script src="js/toast.js"></script>
  <script src="js/restablecer_contrasena.js"></script>
</body>
</html>
