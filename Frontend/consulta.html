<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiGeRU — Consulta pública</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="banner"><h1>SiGeRU — Sistema de Gestión de Residuos Urbanos</h1></header>

  <main>
    <h2>Realizar una consulta</h2>
    <p style="font-size:14px; color:var(--texto-tenue); margin-top:-6px;">
      No hace falta tener cuenta. Te respondemos por email.
    </p>
    <form id="formConsulta" novalidate>
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="5" required
        style="width:100%; padding:9px 10px; border:1px solid var(--gris-borde); border-radius:5px; font-size:14px; font-family:inherit;"></textarea>

      <button type="submit" class="principal">Enviar consulta</button>
      <div id="mensajeEstado" class="mensaje"></div>
      <a class="enlace-secundario" href="landing.html">Volver al inicio</a>
    </form>
  </main>

  <script src="js/consulta.js"></script>
</body>
</html>
