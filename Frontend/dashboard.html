<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiGeRU — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-pagina="dashboard">
  <div class="dashboard">
    <div id="navAdmin"></div>

    <div class="contenido">
      <div class="topbar">
        <h1>Panel de Control</h1>
        <div id="rolUsuario"></div>
      </div>

      <div class="tarjetas-estadisticas" id="tarjetasEstadisticas">
        <!-- se completan por JS -->
      </div>
      <p class="info-actualizada" id="infoActualizada">Información actualizada: —</p>

      <div class="fila-paneles-dashboard">
        <section class="bloque-dashboard">
          <h3>Distribución de incidencias por estado</h3>
          <div class="grafico-estados" id="graficoEstadosIncidencias">
            <!-- se completa por JS -->
          </div>
        </section>

        <section class="bloque-dashboard">
          <div class="encabezado-bloque-oscuro">
            <h3>Incidencias recientes</h3>
            <a href="panel_incidencias.html" class="enlace-ver-todas">Ver todas</a>
          </div>
          <ul class="lista-incidencias-recientes" id="listaIncidenciasRecientes">
            <!-- se completa por JS -->
          </ul>
        </section>
      </div>

      <p class="nota-pie-oscura">
        Los reportes exportables (PDF/Excel, RF15) y el mapa interactivo (RF13)
        se agregan junto con api-incidencias y api-recoleccion.
      </p>
    </div>
  </div>

  <script src="js/sesion.js"></script>
  <script src="js/nav_admin.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
