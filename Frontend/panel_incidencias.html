<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiGeRU — Incidencias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="incidencias">
  <div class="dashboard">
    <div id="navAdmin"></div>

    <div class="contenido">
      <div class="topbar">
        <h1>Incidencias</h1>
        <div id="rolUsuario"></div>
      </div>
      <div id="mensajeGlobal" class="mensaje"></div>

      <div class="formulario-alta" style="margin-bottom:18px;">
        <label for="filtroEstado">Filtrar por estado</label>
        <select id="filtroEstado" style="max-width:260px;">
          <option value="">Todas</option>
          <option value="PENDIENTE">Pendiente</option>
          <option value="EN_PROCESO">En proceso</option>
          <option value="RESUELTA">Resuelta</option>
        </select>
      </div>

      <table class="tabla-datos">
        <thead>
          <tr>
            <th>ID</th><th>Contenedor</th><th>Tipo</th><th>Descripción</th>
            <th>Estado</th><th>Cuadrilla</th><th>Registrada</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaIncidencias"></tbody>
      </table>
    </div>
  </div>

  <script src="js/sesion.js"></script>
  <script src="js/nav_admin.js"></script>
  <script src="js/panel_incidencias.js"></script>
</body>
</html>
