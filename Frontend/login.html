<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiGeRU — Iniciar sesión</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="banner"><h1>SiGeRU — Sistema de Gestión de Residuos Urbanos</h1></header>

  <main>
    <h2>Iniciar sesión</h2>
    <form id="formLogin" novalidate>
      <label for="ci">Cédula de identidad</label>
      <input type="text" id="ci" name="ci" required>

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" required>

      <button type="submit" class="principal">Ingresar</button>
      <div id="mensaje" class="mensaje"></div>
      <a class="enlace-secundario" href="landing.html">Volver al inicio</a>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
