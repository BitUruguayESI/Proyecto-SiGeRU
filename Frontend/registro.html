<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiGeRU — Registro</title>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="banner"><h1>SiGeRU — Sistema de Gestión de Residuos Urbanos</h1></header>

  <main>
    <h2>Registro de usuario</h2>
    <form id="formRegistro" novalidate>
      <label for="ci">Cédula de identidad</label>
      <input type="text" id="ci" name="ci" placeholder="Sin puntos ni guion" required>

      <label for="nombre_completo">Nombre completo</label>
      <input type="text" id="nombre_completo" name="nombre_completo" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" minlength="8" required>

      <label for="confirmar_contrasena">Confirmar contraseña</label>
      <input type="password" id="confirmar_contrasena" required>

      <label for="tipo_usuario">Tipo de usuario</label>
      <select id="tipo_usuario" name="tipo_usuario" required>
        <option value="">Seleccionar...</option>
        <option value="OPERARIO">Operario</option>
        <option value="ADMINISTRADOR">Administrador</option>
      </select>

      <div id="bloqueCargo" class="oculto">
        <label for="cargo">Cargo</label>
        <select id="cargo" name="cargo">
          <option value="">Seleccionar...</option>
          <option value="RECOLECTOR">Recolector</option>
          <option value="CHOFER">Chofer</option>
        </select>
      </div>

      <label>Teléfono(s)</label>
      <div id="listaTelefonos"></div>
      <button type="button" id="btnAgregarTelefono" class="secundario" style="margin-top:6px;">+ Agregar teléfono</button>

      <button type="submit" class="principal">Registrarme</button>
      <div id="mensaje" class="mensaje"></div>
      <a class="enlace-secundario" href="login.html">¿Ya tenés cuenta? Iniciar sesión</a>
    </form>
  </main>

  <script src="js/registro.js"></script>
</body>
</html>
