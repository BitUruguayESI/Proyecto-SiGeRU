; La imagen oficial php:8.2-apache (usada en Dockerfile) no trae ningún
; php.ini propio, así que PHP queda con display_errors=On por defecto.
; Esta API solo devuelve JSON: si cualquier endpoint dispara un warning,
; notice, deprecation o un error fatal no capturado, PHP lo imprime como
; HTML directo en la respuesta (ANTES o en vez del JSON), y el frontend
; falla con "Unexpected token '<' ... is not valid JSON" al intentar
; parsearlo (visto en el Dashboard: ver Frontend/src/js/dashboard.js).
;
; Acá apagamos esa salida HTML y la mandamos al log de Apache en su
; lugar, para poder seguir viendo los errores (con `docker compose logs
; backend`) sin que nunca lleguen rotos al navegador.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
